name: Test Azure Login

on:
  push:
    branches:
      - main

env:

  WORKSPACE_NAME: karan-ml-workspace

  RESOURCE_GROUP: ml-project-rg

jobs:
  test-login:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Login
        run: az account show

      - name : print workspace name 
        run : echo $  WORKSPACE_NAME